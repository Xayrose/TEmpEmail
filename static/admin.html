<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEMPMAIL Admin</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>:root{color-scheme:dark}body{margin:0;padding:24px;font:14px -apple-system,BlinkMacSystemFont,sans-serif;color:#f4f5f7;background:radial-gradient(ellipse at 50% -20%,#24262b 0,transparent 48%),linear-gradient(180deg,#0b0c0f,#050506 70%)}main{max-width:700px;margin:auto}.glass{background:linear-gradient(145deg,rgba(255,255,255,.105),rgba(255,255,255,.035));border:1px solid rgba(220,225,235,.2);border-radius:22px;padding:20px;box-shadow:inset 0 1px rgba(255,255,255,.12),0 14px 40px #0008;backdrop-filter:blur(20px)}h1{font-size:20px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:rgba(255,255,255,.06);border:1px solid rgba(220,225,235,.14);border-radius:16px;padding:15px}.stat b{display:block;font-size:27px}.stat span{font-size:10px;color:#9298a3}.user{padding:12px 0;border-bottom:1px solid rgba(220,225,235,.14);display:flex;justify-content:space-between;gap:10px;font-size:12px}.muted{color:#9298a3;font-size:12px}</style></head><body><main><section class="glass"><h1>TEMPMAIL · Admin</h1><p class="muted">Сводная статистика сервиса</p><div class="grid" id="stats"></div><h3>Последние пользователи</h3><div id="users" class="muted">Загрузка…</div><p id="error" class="muted"></p></section></main><script>const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();async function load(){try{const r=await fetch("/api/admin/stats",{headers:{Authorization:"tma "+(tg?.initData||"")}});const d=await r.json();if(!r.ok)throw Error(d.detail||"Доступ запрещён");document.getElementById("stats").innerHTML=[["Активные ящики",d.active_boxes],["Активные пользователи",d.active_users],["Всего создано",d.total_created],["Получено писем",d.messages_seen]].map(x=>'<div class="stat"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>').join("");document.getElementById("users").innerHTML=d.users.map(u=>'<div class="user"><span>'+((u.username&&"@"+u.username)||u.telegram_id)+'</span><b>'+u.boxes_created+' адресов</b></div>').join("")||"Пока нет активности"}catch(e){document.getElementById("error").textContent=e.message+" · Откройте страницу из Telegram Mini App под аккаунтом администратора."}}load();</script></body></html>
