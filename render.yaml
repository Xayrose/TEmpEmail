services:
  - type: web
    name: xayrose-tempmail
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        value: "8907694476"
      - key: DB_PATH
        value: /app/data/tempmail.sqlite3
      - key: POLL_INTERVAL
        value: "15"
      - key: WEBAPP_URL
        fromService:
          type: web
          name: xayrose-tempmail
          property: host
